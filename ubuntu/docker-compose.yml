services:
  # One shot, as root, so ./data belongs to the wallet user. No network.
  prepare:
    image: sha256:c4cc7d89cdd48e6153a5ba0cf3cda74fb6232933418a72f2fd74455885847e77
    pull_policy: never
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data && chown -R 1000:1000 /data"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
  autarki:
    image: sha256:c4cc7d89cdd48e6153a5ba0cf3cda74fb6232933418a72f2fd74455885847e77
    pull_policy: never
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./data:/data
